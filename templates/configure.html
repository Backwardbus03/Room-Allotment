<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configure Sessions</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1,
        h2 {
            text-align: center;
            color: #444;
        }

        h2 {
            font-size: 1.2rem;
            margin-top: 20px;
            margin-bottom: 15px;
            text-align: left;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }

        /* --- Entry Section --- */
        .entry-section {
            background-color: #fafafa;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #eee;
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 150px;
        }

        .form-group label {
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .supervisor-list {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            background: white;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 5px;
            border-radius: 4px;
        }

        .supervisor-item {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
            user-select: none;
        }

        /* --- Button Styles --- */
        button {
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 4px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .add-btn {
            background-color: #66bb6a;
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .submit-btn {
            background-color: #5c6bc0;
            color: white;
            margin-top: 30px;
            display: block;
            width: 100%;
            font-size: 16px;
            padding: 15px;
        }

        .remove-btn {
            background-color: #ef5350;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
        }

        /* --- Table Styles --- */
        .table-container {
            margin-top: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th,
        td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f8f9fa;
            color: #555;
            font-weight: 600;
        }

        .unavailable-cell {
            font-size: 0.85rem;
            color: #666;
            max-width: 250px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .flash-msg {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Configure Sessions</h1>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="flash-msg">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <!-- Entry Form Section -->
        <div class="entry-section">
            <div class="form-row">
                <div class="form-group">
                    <label for="input-date">Date</label>
                    <input type="text" id="input-date" placeholder="e.g. 06 November 2025">
                </div>
                <div class="form-group">
                    <label for="input-time">Time Slot</label>
                    <input type="text" id="input-time" placeholder="e.g. 11.15 am to 01.15 pm">
                </div>
                <div class="form-group" style="flex: 2;">
                    <label for="input-subject">Subject</label>
                    <input type="text" id="input-subject" placeholder="e.g. Introduction to Bio...">
                </div>
                <div class="form-group">
                    <label for="input-students">Total Students</label>
                    <input type="number" id="input-students" min="1" placeholder="e.g. 50">
                </div>
            </div>

            <div class="form-group">
                <label>Unavailable Supervisors (for this specific session):</label>
                <div class="supervisor-list" id="supervisor-input-list">
                    <!-- JS will populate this -->
                </div>
            </div>

            <button type="button" class="add-btn" onclick="addSessionRowFromInput()">+ Add Session to List</button>
        </div>

        <!-- List Section -->
        <h2>Sessions to Schedule</h2>
        <div class="table-container">
            <table id="sessions-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Subject</th>
                        <th>Students</th>
                        <th>Unavailable Supervisors</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr id="empty-row">
                        <td colspan="7" class="empty-state" style="text-align:center; padding:20px; color:#999;">No
                            sessions added yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <form action="/generate" method="POST" id="main-form">
            <input type="hidden" name="rooms_json" value="{{ rooms_json }}">
            <input type="hidden" name="supervisors_json" value="{{ supervisors_json }}">

            <div
                style="margin-top: 30px; margin-bottom: 20px; background: #e8f5e9; padding: 15px; border-radius: 5px; border: 1px solid #c8e6c9;">
                <label for="exam_name" style="font-weight: bold; display: block; margin-bottom: 5px;">Exam Name /
                    Title:</label>
                <input type="text" id="exam_name" name="exam_name" required placeholder="e.g. End Semester Exam 2024"
                    style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;">
            </div>

            <div id="hidden-inputs-container"></div>

            <button type="submit" class="submit-btn" onclick="return validateForm()">Generate Schedule</button>
        </form>
    </div>

    <script>
        const allSupervisors = JSON.parse('{{ supervisors_json | safe }}');
        // Use default empty array if not present. Use tojson for safety.
        const preloadedSessions = {{ preloaded_sessions | safe }};

        let sessionCounter = 0;
        let rowCount = 0;

        function initSupervisorList() {
            const container = document.getElementById('supervisor-input-list');
            let html = '';
            allSupervisors.forEach((name, index) => {
                html += `
                    <div class="supervisor-item">
                        <input type="checkbox" id="sup-${index}" value="${name}" class="sup-checkbox">
                        <label for="sup-${index}">${name}</label>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function addSessionRow(date, time, subject, students, unavailable) {
            sessionCounter++;
            rowCount++;
            const hiddenContainer = document.getElementById('hidden-inputs-container');

            // --- Hidden Inputs for Backend ---
            const div = document.createElement('div');
            div.id = `hidden-session-${sessionCounter}`;

            function createHidden(name, val) {
                const i = document.createElement('input');
                i.type = 'hidden';
                i.name = name;
                i.value = val;
                return i;
            }

            // Legacy IDs for app compatibility (it iterates getlist('session_ids'))
            div.appendChild(createHidden('session_ids', sessionCounter));
            div.appendChild(createHidden(`day_${sessionCounter}`, '0'));
            div.appendChild(createHidden(`session_type_${sessionCounter}`, 'Default'));

            // New Fields
            div.appendChild(createHidden(`date_${sessionCounter}`, date));
            div.appendChild(createHidden(`time_${sessionCounter}`, time));
            div.appendChild(createHidden(`subject_${sessionCounter}`, subject));
            div.appendChild(createHidden(`total_students_${sessionCounter}`, students));

            unavailable.forEach(name => {
                div.appendChild(createHidden(`unavailable_${sessionCounter}`, name));
            });

            hiddenContainer.appendChild(div);

            // --- Table UI ---
            const tbody = document.querySelector('#sessions-table tbody');
            const emptyRow = document.getElementById('empty-row');
            if (emptyRow) emptyRow.remove();

            const tr = document.createElement('tr');
            tr.id = `row-${sessionCounter}`;
            const unavStr = unavailable.length ? unavailable.join(', ') : '';

            tr.innerHTML = `
                <td>${rowCount}</td>
                <td>${date}</td>
                <td>${time}</td>
                <td>${subject}</td>
                <td><input type="number" value="${students}" min="1" style="width:60px" onchange="updateStudents(${sessionCounter}, this.value)"></td> 
                <td class="unavailable-cell" title="${unavStr}">${unavStr || 'None'}</td>
                <td><button type="button" class="remove-btn" onclick="removeSession(${sessionCounter})">Remove</button></td>
            `;
            tbody.appendChild(tr);
        }

        function updateStudents(sid, val) {
            const hiddenDiv = document.getElementById(`hidden-session-${sid}`);
            if (hiddenDiv) {
                const input = hiddenDiv.querySelector(`input[name="total_students_${sid}"]`);
                if (input) input.value = val;
            }
        }

        function addSessionRowFromInput() {
            const date = document.getElementById('input-date').value;
            const time = document.getElementById('input-time').value;
            const subject = document.getElementById('input-subject').value;
            const students = document.getElementById('input-students').value;

            if (!date || !time || !students) {
                alert("Please fill required fields (Date, Time, Students).");
                return;
            }

            const checkboxes = document.querySelectorAll('.sup-checkbox:checked');
            const unavailable = Array.from(checkboxes).map(cb => cb.value);

            addSessionRow(date, time, subject, students, unavailable);

            // Reset
            document.getElementById('input-students').value = '';
            document.getElementById('input-subject').value = '';
            checkboxes.forEach(cb => cb.checked = false);
        }

        function removeSession(id) {
            document.getElementById(`hidden-session-${id}`).remove();
            document.getElementById(`row-${id}`).remove();
            const tbody = document.querySelector('#sessions-table tbody');
            if (tbody.children.length === 0) {
                tbody.innerHTML = '<tr id="empty-row"><td colspan="7" class="empty-state" style="text-align:center">No sessions added yet.</td></tr>';
                rowCount = 0;
            }
        }

        function validateForm() {
            if (rowCount === 0) {
                alert("Please add sessions.");
                return false;
            }
            return true;
        }

        window.onload = function () {
            initSupervisorList();

            // Auto-load sessions
            if (preloadedSessions && preloadedSessions.length > 0) {
                preloadedSessions.forEach(sess => {
                    // Default students to 50 if not known, let user edit
                    addSessionRow(sess.date, sess.time, sess.subject, 50, []);
                });
            }
        };
    </script>
</body>

</html>
