{% extends "base.html" %}

{% block title %}Login - Exam Scheduler{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg border-0" style="max-width: 450px; width: 100%;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
                <h3 class="mt-3 fw-bold text-dark">Welcome Back</h3>
                <p class="text-muted small">Access the Exam Scheduler Dashboard</p>
            </div>

            <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active rounded py-2 small fw-bold" id="pills-admin-tab"
                        data-bs-toggle="pill" data-bs-target="#pills-admin" type="button" role="tab">Admin</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link rounded py-2 small fw-bold" id="pills-supervisor-tab" data-bs-toggle="pill"
                        data-bs-target="#pills-supervisor" type="button" role="tab">Supervisor</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link rounded py-2 small fw-bold" id="pills-register-tab" data-bs-toggle="pill"
                        data-bs-target="#pills-register" type="button" role="tab">Register</button>
                </li>
            </ul>

            <div class="tab-content" id="pills-tabContent">
                <!-- Admin Form -->
                <div class="tab-pane fade show active" id="pills-admin" role="tabpanel">
                    <form method="POST">
                        <input type="hidden" name="role" value="admin">
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold text-uppercase">Admin Password</label>
                            <input type="password" name="password"
                                class="form-control form-control-lg bg-light border-0" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm fw-bold fs-6">Login as
                            Admin</button>
                    </form>
                </div>

                <!-- Supervisor Form -->
                <div class="tab-pane fade" id="pills-supervisor" role="tabpanel">
                    <div class="alert alert-info py-2 small d-flex align-items-center">
                        <i class="bi bi-info-circle me-2"></i> Use the exact name from records.
                    </div>
                    <form method="POST">
                        <input type="hidden" name="role" value="supervisor">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold text-uppercase">Full Name</label>
                            <input type="text" name="name" class="form-control form-control-lg bg-light border-0"
                                required placeholder="e.g. John Doe">
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold text-uppercase">Password</label>
                            <input type="password" name="password"
                                class="form-control form-control-lg bg-light border-0" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm fw-bold fs-6">Login as
                            Supervisor</button>
                    </form>
                </div>

                <!-- Register Form -->
                <div class="tab-pane fade" id="pills-register" role="tabpanel">
                    <form action="/register" method="POST">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold text-uppercase">Full Name</label>
                            <input type="text" name="name" class="form-control form-control-lg bg-light border-0"
                                required placeholder="Your Name">
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold text-uppercase">Set Password</label>
                            <input type="password" name="password"
                                class="form-control form-control-lg bg-light border-0" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-dark btn-lg w-100 shadow-sm fw-bold fs-6">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
